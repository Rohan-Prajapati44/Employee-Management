
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Employee Management System - Login</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            body{
                background: linear-gradient(135deg,#0d6efd,#6610f2);
                height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
            }

            .login-card{
                width:400px;
                border:none;
                border-radius:15px;
                box-shadow:0 10px 25px rgba(0,0,0,.3);
            }

            .card-header{
                background:#0d6efd;
                color:#fff;
                text-align:center;
                font-size:28px;
                font-weight:bold;
                padding:20px;
            }

            .btn-login{
                width:100%;
            }

            .footer{
                text-align:center;
                margin-top:15px;
                color:#777;
            }
        </style>

    </head>
    <body>

        <div class="card login-card">

            <div class="card-header">
                Employee Login
            </div>

            <div class="card-body">

                <form action="LoginServlet.jsp" method="post">

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text"
                               name="username"
                               class="form-control"
                               placeholder="Enter Username"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Enter Password"
                               required>
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-primary btn-login">
                            Login
                        </button>
                    </div>

                </form>

                <div class="footer">
                    <p class="mt-3">
                        Employee Management System
                    </p>
                </div>

            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
